name: Sync fork with upstream

on:
  schedule:
    # Keep the fork from drifting too far from NousResearch/hermes-agent:main.
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-fork-with-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Open upstream sync pull request
    if: ${{ github.repository == 'ytheesh96/hermes-loop' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      SYNC_BRANCH: upstream-sync
      UPSTREAM_REPOSITORY: NousResearch/hermes-agent
      ISSUE_LABEL: upstream-sync
    steps:
      - name: Checkout fork history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Prepare upstream sync branch
        id: sync
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin "${BASE_BRANCH}"
          git fetch --no-tags upstream "${BASE_BRANCH}"
          git fetch --no-tags origin \
            "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null || true
          git checkout -B "${SYNC_BRANCH}" "origin/${BASE_BRANCH}"

          base_sha=$(git rev-parse HEAD)
          if ! details=$(git merge --no-edit --no-ff "upstream/${BASE_BRANCH}" 2>&1); then
            git merge --abort || true
            {
              echo "status=conflict"
              echo "base_sha=${base_sha}"
              echo "details<<EOF"
              echo "${details}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          head_sha=$(git rev-parse HEAD)
          if [ "${head_sha}" = "${base_sha}" ]; then
            {
              echo "status=noop"
              echo "base_sha=${base_sha}"
              echo "head_sha=${head_sha}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git push --force-with-lease origin "HEAD:refs/heads/${SYNC_BRANCH}"
          {
            echo "status=updated"
            echo "base_sha=${base_sha}"
            echo "head_sha=${head_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open or refresh upstream sync pull request
        if: steps.sync.outputs.status == 'updated'
        env:
          BASE_SHA: ${{ steps.sync.outputs.base_sha }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
        run: |
          set -euo pipefail

          body_file=$(mktemp)
          printf 'This draft PR refreshes the fork from [%s:%s](https://github.com/%s/commits/%s) without writing directly to protected `%s`.\n\n- Fork base: `%s`\n- Proposed sync head: `%s`\n- Workflow run: %s/%s/actions/runs/%s\n\nKeep this PR in draft until the exact head passes CI and fork-specific review.\n' \
            "${UPSTREAM_REPOSITORY}" \
            "${BASE_BRANCH}" \
            "${UPSTREAM_REPOSITORY}" \
            "${BASE_BRANCH}" \
            "${BASE_BRANCH}" \
            "${BASE_SHA}" \
            "${HEAD_SHA}" \
            "${GITHUB_SERVER_URL}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}" > "${body_file}"

          pr_number=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --head "${SYNC_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${pr_number}" ]; then
            gh pr edit "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "chore: sync fork with upstream" \
              --body-file "${body_file}"
            refresh_comment=$(printf 'Refreshed to `%s` by %s/%s/actions/runs/%s.' \
              "${HEAD_SHA}" \
              "${GITHUB_SERVER_URL}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_RUN_ID}")
            gh pr comment "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "${refresh_comment}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --head "${SYNC_BRANCH}" \
              --base "${BASE_BRANCH}" \
              --title "chore: sync fork with upstream" \
              --body-file "${body_file}"
          fi

      - name: Close resolved upstream-sync issues
        if: steps.sync.outputs.status == 'updated' || steps.sync.outputs.status == 'noop'
        run: |
          set -euo pipefail

          for issue in $(gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --label "${ISSUE_LABEL}" \
              --json number \
              --jq '.[].number'); do
            gh issue close "${issue}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "The latest scheduled upstream merge completed without conflicts, so this alert is resolved."
          done

      - name: Open conflict issue
        if: steps.sync.outputs.status == 'conflict'
        env:
          BASE_SHA: ${{ steps.sync.outputs.base_sha }}
          SYNC_DETAILS: ${{ steps.sync.outputs.details }}
        run: |
          set -euo pipefail

          gh label create "${ISSUE_LABEL}" \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Fork upstream sync needs manual attention" \
            --color D93F0B \
            2>/dev/null || true

          existing_issue=$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label "${ISSUE_LABEL}" \
            --json number \
            --jq '.[0].number // empty')

          body_file=$(mktemp)
          printf 'The scheduled fork sync could not merge `%s:%s` into a branch based on `%s:%s` at `%s`.\n\n**Workflow run:** %s/%s/actions/runs/%s\n\n~~~\n%s\n~~~\n\nResolve this in a worktree, push the result to `%s`, and open or refresh the PR to `%s`. Do not push the merge directly to `%s`.\n' \
            "${UPSTREAM_REPOSITORY}" \
            "${BASE_BRANCH}" \
            "${GITHUB_REPOSITORY}" \
            "${BASE_BRANCH}" \
            "${BASE_SHA}" \
            "${GITHUB_SERVER_URL}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}" \
            "${SYNC_DETAILS}" \
            "${SYNC_BRANCH}" \
            "${BASE_BRANCH}" \
            "${BASE_BRANCH}" > "${body_file}"

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body-file "${body_file}"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Upstream fork sync needs manual attention" \
              --label "${ISSUE_LABEL}" \
              --body-file "${body_file}"
          fi

          exit 1
